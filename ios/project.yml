name: Anthima
options:
  bundleIdPrefix: com.gts2svg
  developmentLanguage: ar
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"
targets:
  Anthima:
    type: application
    platform: iOS
    sources:
      - path: Anthima
    scheme: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gts2svg.anthima
        PRODUCT_NAME: Anthima
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    info:
      path: Anthima/Info.plist
      properties:
        CFBundleDisplayName: Anthima
        CFBundleDevelopmentRegion: ar
        CFBundleLocalizations: [ar]
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
        UIAppFonts:
          - ReemKufi-Bold.ttf
          - ReadexPro-Regular.ttf
          - ReadexPro-SemiBold.ttf
          - ReadexPro-Bold.ttf
          - NotoNaskhArabic-Regular.ttf
          - NotoNaskhArabic-SemiBold.ttf
          - ArefRuqaa-Bold.ttf
