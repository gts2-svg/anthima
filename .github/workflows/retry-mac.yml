name: retry-mac

# GitHub's hosted macOS machines are scarce: a job waits 15 minutes and is cancelled
# when no machine picks it up. This cheap Linux job runs every 15 minutes and re-sends
# the build until it gets a machine: first TestFlight, then the sideload ipa (ios).
# It stops by itself once both have succeeded for the current commit on main, and it
# never retries a real failure (only a run that was cancelled without ever getting a machine).
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: retry-mac
  cancel-in-progress: false

jobs:
  retry:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -eu
          head=$(gh api "repos/$REPO/commits/main" -q .sha)
          echo "main is $head"
          for wf in testflight ios; do
            last=$(gh api "repos/$REPO/actions/workflows/$wf.yml/runs?branch=main&per_page=1" \
                     -q '.workflow_runs[0] | "\(.id) \(.status) \(.conclusion) \(.head_sha)"')
            read -r id status conclusion sha <<< "$last"
            echo "$wf: run $id $status $conclusion on $sha"
            if [ "$status" != "completed" ]; then
              echo "$wf is still waiting or running; nothing to do now."; exit 0
            fi
            if [ "$sha" = "$head" ] && [ "$conclusion" = "success" ]; then
              echo "$wf already succeeded for this commit."; continue
            fi
            if [ "$sha" = "$head" ] && [ "$conclusion" = "failure" ]; then
              echo "$wf really failed for this commit; not retrying."; exit 0
            fi
            if [ "$sha" = "$head" ] && [ "$conclusion" = "cancelled" ]; then
              # Retry only if no macOS job of that run ever got a machine.
              started=$(gh api "repos/$REPO/actions/runs/$id/jobs" \
                          -q '[.jobs[] | select(.labels[0] | startswith("macos")) | select(.runner_name != null and .runner_name != "")] | length')
              if [ "$started" != "0" ]; then
                echo "$wf was cancelled after it had started; not retrying."; exit 0
              fi
            fi
            echo "Sending $wf again."
            gh workflow run "$wf.yml" --ref main -R "$REPO"
            exit 0
          done
          echo "Both builds are done for $head. Nothing to retry."
