name: apps-testflight

# يرفع تطبيقَي «وزن» و«تحدّي» إلى TestFlight. مفاتيح Apple محفوظة في هذا المستودع،
# فيجلب التشغيلُ مستودعَ التطبيق المطلوب (عامّ) ويبني مجلد ios/ فيه، ثم يوقّعه ويرفعه.
# يشتغل يدوياً فقط: Actions ← apps-testflight ← Run workflow، واختر التطبيق.
on:
  workflow_dispatch:
    inputs:
      app:
        description: "التطبيق"
        type: choice
        options: [tahaddi, wazn, tasbeeb]
        default: tahaddi

permissions:
  contents: read

concurrency:
  group: apps-testflight-${{ inputs.app }}
  cancel-in-progress: true

jobs:
  upload:
    runs-on: macos-15-intel
    timeout-minutes: 60
    env:
      REPO: ${{ inputs.app == 'wazn' && 'gts2-svg/Wazn' || (inputs.app == 'tasbeeb' && 'gts2-svg/anthima' || 'gts2-svg/tahaddi') }}
      NAME: ${{ inputs.app == 'wazn' && 'Wazn' || (inputs.app == 'tasbeeb' && 'Tasbeeb' || 'Tahaddi') }}
      IOS_DIR: ${{ inputs.app == 'tasbeeb' && 'app/tasbeeb/ios' || 'app/ios' }}
    steps:
      - name: Check the Apple secrets
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -z "$ASC_KEY_ID" ] || [ -z "$ASC_ISSUER_ID" ] || [ -z "$ASC_KEY_P8" ] || [ -z "$TEAM_ID" ]; then
            echo "::error::Apple secrets are missing in this repository"; exit 1
          fi

      - uses: actions/checkout@v4
        with:
          repository: ${{ env.REPO }}
          path: app
          persist-credentials: false

      - name: Select newest Xcode
        run: |
          X=$(ls -d /Applications/Xcode_*.app | grep -v beta | sort -V | tail -1)
          sudo xcode-select -s "$X"
          xcodebuild -version

      - name: Generate project
        run: |
          "$IOS_DIR/build_web.sh"
          brew install xcodegen
          cd "$IOS_DIR" && xcodegen generate

      - name: Archive
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        working-directory: ${{ env.IOS_DIR }}
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          KEY="$RUNNER_TEMP/keys/AuthKey_$ASC_KEY_ID.p8"
          printf '%s\n' "$ASC_KEY_P8" > "$KEY"
          set -o pipefail
          xcodebuild -project "$NAME.xcodeproj" -scheme "$NAME" -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/$NAME.xcarchive" \
            DEVELOPMENT_TEAM="$TEAM_ID" CODE_SIGN_STYLE=Automatic \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY" -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            archive 2>&1 | tee archive.log | grep -E "error:|warning: .*[Pp]rovision|ARCHIVE" || true
          test -d "$RUNNER_TEMP/$NAME.xcarchive" || { tail -n 60 archive.log; exit 1; }

      - name: Upload to TestFlight
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          KEY="$RUNNER_TEMP/keys/AuthKey_$ASC_KEY_ID.p8"
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
            <key>testFlightInternalTestingOnly</key><true/>
          </dict>
          </plist>
          PLIST
          set -o pipefail
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/$NAME.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY" -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            2>&1 | tee export.log | tail -n 40
          grep -q "EXPORT SUCCEEDED" export.log

      - name: Clean up key
        if: always()
        run: rm -rf "$RUNNER_TEMP/keys"

  testers:
    needs: upload
    uses: ./.github/workflows/testflight-group.yml
    with:
      bundle_id: "${{ inputs.app == 'wazn' && 'com.gts2svg.wazn' || (inputs.app == 'tasbeeb' && 'com.gts2svg.tasbeeb' || 'com.gts2svg.tahaddi') }}"
    secrets: inherit
