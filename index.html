/* Layout: one-column phone app — navy header band, content, fixed bottom tab bar */
:root{

  --bg:#0f151d; --card:#161f2a; --line:#253243; --line2:#1d2836; --ink:#e9eef4; --mut:#9fb0c2; --field:#1b2531; --danger:#e07a72; color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--ui);font-size:15px;direction:rtl;-webkit-tap-highlight-color:transparent}
*{box-sizing:border-box}

a{color:var(--navy)}

.search{background:#fff;border-radius:16px;min-height:52px;display:flex;align-items:center;gap:10px;padding:0 14px;color:#5d6a78}

.askbar{position:fixed;left:0;right:0;bottom:calc(64px + env(safe-area-inset-bottom,0px));background:var(--card);border-top:1px solid var(--line);padding-block:10px;z-index:5}

.dots{display:inline-flex;gap:4px}.dots i{width:6px;height:6px;border-radius:50%;background:var(--mut);animation:b 1s infinite}.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes b{0%,100%{opacity:.25}50%{opacity:1}}
@media (prefers-reduced-motion:reduce){.dots i{animation:none}.chev{transition:none}}
/* nav */
nav.tabbar{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:8px 8px calc(10px + env(safe-area-inset-bottom,0px));z-index:6}
nav.tabbar .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,minmax(0,1fr))}
nav.tabbar a{text-decoration:none;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--mut);font-size:11px;min-height:46px;justify-content:center}

:root[data-theme="dark"] nav.tabbar a[aria-current="page"]{color:var(--gold-ink)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(96px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;z-index:9;max-width:90%}

.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:13px;font-weight:600}
.field input,.field select,.field textarea{border:1px solid var(--line);background:var(--card);border-radius:12px;min-height:46px;padding:8px 12px;font-size:15px}
.field textarea{min-height:200px;line-height:1.8;font-family:var(--text);font-size:16px}
.muted{color:var(--mut);font-size:13px;line-height:1.7}
.err{color:var(--danger);font-size:14px}

/* ---------- Arabic normalisation & ordinals ---------- */
function norm(s){return String(s||'').replace(/[ً-ْٰـ]/g,'').replace(/[أإآٱ]/g,'ا').replace(/ة/g,'ه').replace(/ى/g,'ي').replace(/ؤ/g,'و').replace(/ئ/g,'ي').replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/[^ء-ي0-9a-z\s/]/gi,' ').replace(/\s+/g,' ').trim().toLowerCase()}
const UN={'الاولي':1,'الاول':1,'الحاديه':1,'الحادي':1,'الثانيه':2,'الثاني':2,'الثالثه':3,'الثالث':3,'الرابعه':4,'الرابع':4,'الخامسه':5,'الخامس':5,'السادسه':6,'السادس':6,'السابعه':7,'السابع':7,'الثامنه':8,'الثامن':8,'التاسعه':9,'التاسع':9,'العاشره':10,'العاشر':10};
const TENS={'عشرون':20,'ثلاثون':30,'اربعون':40,'خمسون':50,'ستون':60,'سبعون':70,'ثمانون':80,'تسعون':90,'عشرين':20,'ثلاثين':30,'اربعين':40,'خمسين':50,'ستين':60,'سبعين':70,'ثمانين':80,'تسعين':90};
const HUN={'مائه':100,'مئه':100,'مائتين':200,'مائتان':200,'مئتين':200,'ثلاثمائه':300,'ثلاثمئه':300,'اربعمائه':400,'اربعمئه':400,'خمسمائه':500,'خمسمئه':500,'ستمائه':600,'ستمئه':600,'سبعمائه':700,'سبعمئه':700,'ثمانمائه':800,'ثمانمئه':800,'تسعمائه':900,'تسعمئه':900};
[UN,TENS,HUN].forEach(o=>Object.keys(o).forEach(k=>{const n=norm(k);if(n!==k){o[n]=o[k]}}));
function ordinal(words){
  const d=norm(words).match(/\d+/); if(d) return +d[0];
  let tot=0,hit=false;
  for(let w of norm(words).split(' ')){
    w=w.replace(/^و/,''); const bare=w.replace(/^ال/,'');
    if(UN[w]!=null){tot+=UN[w];hit=true}
    else if(UN['ال'+w]!=null){tot+=UN['ال'+w];hit=true}
    else if(bare==='عشره'||bare==='عشر'){tot+=10;hit=true}
    else if(TENS[bare]!=null){tot+=TENS[bare];hit=true}
    else if(HUN[bare]!=null){tot+=HUN[bare];hit=true}
  }
  return hit?tot:null;
}
/* ---------- search ---------- */
function lev(a,b){if(Math.abs(a.length-b.length)>1)return 2;const m=a.length,n=b.length;let p=Array(n+1).fill(0).map((_,i)=>i);for(let i=1;i<=m;i++){const c=[i];for(let j=1;j<=n;j++)c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1));p=c}return p[n]}
const STOP=new Set('في من على عن الى الي او ان اذا ما لا هل وش ايش كيف متى اللي الذي التي هو هي و ثم مع بعد قبل كل له لها به بها هذا هذه ذلك تلك يا اي عند كان يكون تكون اريد ابغي ابي نص الماده ماده نظام'.split(' '));
function toks(s){return norm(s).split(' ').filter(w=>w.length>1&&!STOP.has(w)).map(w=>w.length>4?w.replace(/^(وال|بال|فال|كال|لل|ال|و)/,''):w)}
function allArts(){const out=[];for(const id of S.order){for(const a of (S.arts[id]||[]))out.push(a)}return out}
function search(q,limit){
  q=String(q||'').trim(); if(!q) return [];
  const res=[];
  // direct article number: "م55" "55" "مادة 120 معاملات"
  const nm=norm(q).match(/(?:^|\s|م)(\d{1,4})(?:\/(\d+))?/);
  const qt=toks(q);
  for(const a of allArts()){
    let sc=0;
    if(nm && String(a.n)===nm[1]) sc+=6;
    if(!a._t){a._t=toks(a.text+' '+(a.title||'')); a._s=new Set(a._t); a._law=toks(S.laws[a.lawId]?.name||'')}
    for(const t of qt){
      if(/^\d+$/.test(t)) continue;
      if(a._s.has(t)){sc+=2;continue}
      if(a._law.includes(t)){sc+=1.2;continue}
      if(t.length>=4){for(const w of a._s){if(w.length>=4&&(w.startsWith(t)||t.startsWith(w)||lev(w,t)<=1)){sc+=1.2;break}}}
    }
    if(sc>0) res.push({a,sc});
  }
  res.sort((x,y)=>y.sc-x.sc||x.a.n-y.a.n);
  return res.slice(0,limit||40).map(r=>r.a);
}
/* ---------- قاعدة بيانات محلية: الأنظمة من ملف laws.json، والمحفوظات والملاحظات والأنظمة المضافة في جهازك ---------- */
async function localDB(){
  let base={laws:[],chunks:[]};
  try{const r=await fetch('laws.json');if(r.ok)base=await r.json()}catch(e){}
  const LK='anz_local';
  const load=()=>{try{return JSON.parse(localStorage.getItem(LK)||'null')||{}}catch(e){return {}}};
  const save=o=>{localStorage.setItem(LK,JSON.stringify(o))};
  const baseCol={laws:{},chunks:{}};
  base.laws.forEach(l=>{const d=Object.assign({},l);delete d.id;baseCol.laws[l.id]=d});
  base.chunks.forEach(c=>{baseCol.chunks[c.id]=c.data});
  function docs(col){
    const loc=load();const out=Object.assign({},baseCol[col]||{},(loc[col]||{}));
    return Object.keys(out).map(id=>({id,data:()=>out[id]}));
  }
  return {
    collection(col){const q={limit(){return q},async get(){return {docs:docs(col)}}};return q},
    doc(path){const [col,id]=path.split('/');return {
      async set(v){const o=load();(o[col]=o[col]||{})[id]=v;save(o)},
      async delete(){const o=load();if(o[col])delete o[col][id];save(o)}
    }}
  };
}
/* ---------- data ---------- */
function ingest(lawDocs,chunkDocs){
  S.laws={};S.arts={};
  for(const d of lawDocs){S.laws[d.id]=Object.assign({id:d.id},d)}
  const by={};
  for(const c of chunkDocs){(by[c.lawId]=by[c.lawId]||[]).push(c)}
  for(const id in by){
    const arr=[];by[id].sort((a,b)=>a.k-b.k).forEach(c=>(c.articles||[]).forEach(a=>arr.push(Object.assign({lawId:id},a))));
    arr.sort((a,b)=>(a.order??a.n)-(b.order??b.n)); S.arts[id]=arr;
  }
  S.order=Object.keys(S.laws).sort((a,b)=>(S.laws[a].order||99)-(S.laws[b].order||99)||S.laws[a].name.localeCompare(S.laws[b].name,'ar'));
  S.loaded=true;
}
async function loadAll(){
  const cache=ls('anz_cache'); if(cache&&cache.laws){ingest(cache.laws,cache.chunks);render()}
  try{ db=await localDB() }catch(e){ db=null }
  if(!db){S.dbOk=false;S.loaded=true;render();return}
  S.dbOk=true;
  try{
    const [l,c,s,n]=await Promise.all([db.collection('laws').limit(500).get(),db.collection('chunks').limit(1000).get(),db.collection('saved').limit(1000).get(),db.collection('notes').limit(1000).get()]);
    const laws=l.docs.map(d=>Object.assign({id:d.id},d.data())), chunks=c.docs.map(d=>d.data());
    ingest(laws,chunks); ls('anz_cache',{laws,chunks});
    S.saved={};s.docs.forEach(d=>S.saved[d.id]=d.data());
    S.notes={};n.docs.forEach(d=>S.notes[d.id]=(d.data()||{}).text||'');
  }catch(e){S.dbErr=e&&e.message||'تعذر التحميل'}
  render();
}

  '<button class="btn navy" id="askThis">اسأل عن هذا بالمعنى</button></div><main class="pad">'+
  (r.length?'<div class="list">'+r.map(a=>artItem(a,{ex:1})).join('')+'</div>':(S.order.length?'<div class="empty"><b>لا توجد نتائج مطابقة</b>جرّب «اسأل عن هذا بالمعنى»، فهو يفهم الأخطاء والكلام غير المرتب.</div>':emptyLaws()))+'</main>';
}
function vAsk(){
  const msgs=S.chat.map(m=>{
    if(m.q) return '<div class="bubble">'+esc(m.q)+'</div>';
    if(m.wait) return '<div class="ans"><span class="und">يبحث في الأنظمة <span class="dots"><i></i><i></i><i></i></span></span></div>';
    if(m.err) return '<div class="ans"><p class="err">'+esc(m.err)+'</p></div>';
    return '<div class="ans">'+(m.und?'<span class="und">فهمت سؤالك: <b>'+esc(m.und)+'</b></span>':'')+'<p>'+esc(m.answer||'')+'</p>'+
      (m.keys||[]).map(k=>{const a=fromKey(k);if(!a)return '';const L=S.laws[a.lawId];let t=esc(a.text);const hl=m.hl&&m.hl[k];if(hl&&a.text.includes(hl)){t=esc(a.text.slice(0,a.text.indexOf(hl)))+'<mark>'+esc(hl)+'</mark>'+esc(a.text.slice(a.text.indexOf(hl)+hl.length))}
        return '<a class="src" href="'+artRef(a)+'"><span class="num s">'+esc(label(a))+'</span><span class="tt"><small>'+esc(L.name)+'</small><span>'+t+'</span></span></a><button class="btn" data-cite="'+esc(k)+'">'+I.pen+'نسخ المادة ('+esc(label(a))+') للتسبيب</button>'}).join('')+'</div>';
  }).join('');
  return '<div class="hdr pad"><div class="rowx"><div class="sp"><h1>اسأل الأنظمة</h1><small>اكتب كما تتكلم، والجواب من نصوص الأنظمة المحفوظة مع رقم المادة</small></div>'+(S.chat.length?'<button class="link" id="clearChat">محادثة جديدة</button>':'')+'</div></div>'+
  '<main class="pad" style="padding-bottom:84px">'+(msgs||('<div class="empty"><b>أمثلة</b>«المدعي غاب بعد ما انشطبت دعوته ورجع وغاب مره ثانيه وش يصير»<br>«ابغى نص الماده اللي تقول اللي يغلط ويضر غيره يعوضه»</div>'+(S.order.length?'':emptyLaws())))+'</main>'+
  '<form class="askbar pad" id="askForm"><div class="in"><label for="aq"><input id="aq" placeholder="اكتب سؤالك…" autocomplete="off" enterkeyhint="send"></label><button class="send" aria-label="إرسال"'+(S.busy?' disabled':'')+'>'+I.send+'</button></div></form>';
}

  return '<div class="hdr pad"><div class="rowx"><a class="iconbtn light" href="#laws" aria-label="رجوع">'+I.back+'</a><div class="sp"><h1>إضافة نظام</h1><small>الصق نص النظام كما هو من مصدره الرسمي</small></div></div></div><main class="pad">'+
  '<div class="field"><label for="iname">اسم النظام</label><input id="iname" value="'+esc(st.name||'')+'" placeholder="مثال: نظام المرافعات الشرعية"></div>'+
  '<div class="field"><label for="idec">أداة الإصدار</label><input id="idec" value="'+esc(st.decree||'')+'" placeholder="مثال: المرسوم الملكي رقم (م/1) وتاريخ 22/1/1435هـ"></div>'+
  '<div class="field"><label for="icat">التصنيف</label><select id="icat">'+CATS.map(c=>'<option value="'+c.id+'"'+(st.cat===c.id?' selected':'')+'>'+c.name+'</option>').join('')+'</select></div>'+
  '<div class="field"><label for="itext">نص النظام</label><textarea id="itext" placeholder="المادة الأولى:&#10;…&#10;المادة الثانية:&#10;…">'+esc(st.text||'')+'</textarea></div>'+
  '<p class="muted">يُقسَّم النص تلقائياً عند كل سطر يبدأ بـ«المادة»، وتُحفظ الأبواب والفصول من الأسطر التي تبدأ بـ«الباب» أو «الفصل». النص يُحفظ بحروفه دون أي تعديل.</p>'+
  '<button class="btn" id="impPrev">معاينة التقسيم</button>'+
  (st.preview?'<div class="note"><b>'+st.preview.length+' مادة</b>'+(st.preview.length?' — من المادة ('+esc(st.preview[0].label)+') إلى المادة ('+esc(st.preview[st.preview.length-1].label)+')':'')+(st.warn?'<br>'+esc(st.warn):'')+'</div>'+
    (st.preview.length?'<div class="list">'+st.preview.slice(0,3).map(a=>'<div class="item" style="align-items:flex-start"><span class="num s">'+esc(a.label)+'</span><span class="tt"><small>'+esc(a.chapter||'')+'</small><span class="ex">'+esc(a.text)+'</span></span></div>').join('')+'</div><button class="btn navy" id="impSave"'+(st.saving?' disabled':'')+'>'+(st.saving?'يحفظ…':'حفظ النظام')+'</button>':''):'')+
  (st.err?'<p class="err">'+esc(st.err)+'</p>':'')+'</main>';

function vMissing(){return '<div class="hdr pad"><div class="rowx"><a class="iconbtn light" href="#home" aria-label="الرئيسية">'+I.back+'</a><div class="sp"><h1>'+(S.loaded?'غير موجود':'يتم التحميل…')+'</h1><small>'+(S.loaded?'هذه الصفحة غير موجودة في الأنظمة المحفوظة.':'')+'</small></div></div></div>'}

/* ---------- parsing pasted law text ---------- */
function parseLaw(txt){
  const lines=String(txt).replace(/\r/g,'').split('\n');
  const out=[];let cur=null,chapter='',pendingChap=null,warn='';
  const artRe=/^\s*(?:\(|«)?\s*(?:ال)?ماد[ةه]\s*(\(?\s*[0-9٠-٩]+(?:\s*\/\s*[0-9٠-٩]+)?\s*\)?|(?:[ء-ي]+\s*){1,6}?)\s*(?:[:：\-–.)»]\s*|$)/;
  const chapRe=/^\s*(الباب|الفصل|القسم|الكتاب)\s+[ء-ي0-9٠-٩]+/;
  for(let raw of lines){
    const line=raw.trim(); if(!line){if(cur)cur.text+='\n';continue}
    if(chapRe.test(line)&&line.length<90){chapter=line;pendingChap=line.split(/[:：\-–]/).length<2&&line.split(' ').length<=4;continue}
    if(pendingChap&&!artRe.test(line)&&line.length<70){chapter=chapter+': '+line;pendingChap=false;continue}
    pendingChap=false;
    const m=line.match(artRe);
    if(m){const lab=m[1].trim();const n=ordinal(lab);
      if(n!=null){cur={n,label:String(n),heading:'المادة '+lab.replace(/[()]/g,'').trim(),chapter,text:line.slice(m[0].length).trim()};out.push(cur);continue}}
    if(cur) cur.text+=(cur.text&&!cur.text.endsWith('\n')?'\n':'')+line;
  }
  out.forEach((a,i)=>{a.text=a.text.replace(/\n{2,}/g,'\n').trim();a.order=i});
  const seen={};out.forEach(a=>{const b=a.n;if(seen[b]){seen[b]++;a.n=b+'_'+seen[b]}else seen[b]=1});
  const empty=out.filter(a=>!a.text).length; if(empty) warn=empty+' مادة بلا نص، راجع التنسيق قبل الحفظ.';
  return {arts:out,warn};
}
function slug(){return 'law'+Date.now().toString(36)}
async function saveImport(){
  const st=S.imp;if(!db){st.err='لا يمكن الحفظ الآن.';render();return}
  st.saving=true;render();
  try{
    const id=slug();const arts=st.preview.map(a=>({n:a.n,label:a.label,heading:a.heading,chapter:a.chapter,text:a.text,order:a.order}));
    const chunks=[];let curr=[],size=0;
    for(const a of arts){const s=JSON.stringify(a).length*2;if(size+s>180000&&curr.length){chunks.push(curr);curr=[];size=0}curr.push(a);size+=s}
    if(curr.length)chunks.push(curr);
    for(let k=0;k<chunks.length;k++) await db.doc('chunks/'+id+'-'+k).set({lawId:id,k,articles:chunks[k]});
    await db.doc('laws/'+id).set({name:st.name.trim(),decree:(st.decree||'').trim(),cat:st.cat||'other',order:50,addedAt:Date.now()});
    S.imp=null;toast('حُفظ النظام');await loadAll();location.hash='#law-'+id;
  }catch(e){st.saving=false;st.err='تعذر الحفظ: '+(e&&e.message||'');render()}
}

/* ---------- ask ---------- */
async function ask(q){
  q=String(q||'').trim();if(!q||S.busy)return;
  S.chat.push({q});const slot={wait:true};S.chat.push(slot);S.busy=true;render();scrollEnd();
  const done=(o)=>{Object.keys(slot).forEach(k=>delete slot[k]);Object.assign(slot,o);S.busy=false;render();scrollEnd()};
  try{ if(!sample&&window.claude) sample=await claude.use('sample') }catch(e){}
  if(!sample){done({err:'خدمة السؤال بالمعنى تحتاج ربطاً بـClaude، ولم تُفعّل في هذه النسخة بعد. استخدم البحث من الرئيسية.'});return}
  if(!S.order.length){done({err:'لا توجد أنظمة محفوظة بعد لأبحث فيها.'});return}
  try{
    const lawList=S.order.map(id=>S.laws[id].name).join('، ');
    const p1=await sample.json('أنت مساعد بحث لقاضٍ سعودي في نصوص الأنظمة. السؤال التالي قد يكون فيه أخطاء إملائية أو كلام عامي أو غير مرتب، أو وصف لمعنى مادة لا يعرف نصها.\nالأنظمة المتاحة: '+lawList+'\nالسؤال: «'+q+'»\nأعد JSON فقط بالشكل: {"understood":"السؤال بصياغة نظامية فصيحة موجزة","terms":["8 إلى 14 كلمة أو مصطلحاً نظامياً بالفصحى يُرجح ورودها في نص المادة، مفردة أو ثنائية"],"article":"رقم مادة إن ذكره السائل صراحة وإلا فارغ"}',{modelTier:'quick'});
    const und=String(p1&&p1.understood||'');const terms=Array.isArray(p1&&p1.terms)?p1.terms.map(String):[];
    let pool=new Map();
    const add=(arr,w)=>arr.forEach((a,i)=>{const k=key(a.lawId,a.n);pool.set(k,(pool.get(k)||0)+w*(1-i/60))});
    add(search(q,30),1);add(search(und,30),1.3);terms.forEach(t=>add(search(t,12),0.6));
    if(p1&&p1.article) add(search('م'+p1.article+' '+und,10),1.5);
    const cand=[...pool.entries()].sort((a,b)=>b[1]-a[1]).slice(0,24).map(e=>fromKey(e[0])).filter(Boolean);
    if(!cand.length){done({und,answer:'لم أجد في الأنظمة المحفوظة مادة تتناول هذا. قد يكون النظام غير مضاف بعد.',keys:[]});return}
    const ctx=cand.map(a=>'['+key(a.lawId,a.n)+'] '+S.laws[a.lawId].name+' — المادة ('+label(a)+'):\n'+a.text).join('\n\n');
    const p2=await sample.json('أنت مساعد بحث لقاضٍ سعودي. أجب عن السؤال من المواد المرفقة وحدها، ولا تذكر أي نص أو حكم من خارجها، ولا تخترع رقم مادة. إن لم تجب المواد عن السؤال فقل ذلك صراحة.\nالسؤال كما فُهم: «'+(und||q)+'»\n\nالمواد:\n'+ctx+'\n\nأعد JSON فقط: {"answer":"جواب موجز من جملة إلى ثلاث جمل بالفصحى يستند إلى المواد","keys":["مفاتيح المواد التي تجيب، بالترتيب، من 1 إلى 3، كما هي بين الأقواس المعقوفة"],"quotes":{"المفتاح":"عبارة قصيرة منقولة حرفياً من نص تلك المادة هي موضع الشاهد"}}',{modelTier:'default'});
    const keys=(Array.isArray(p2&&p2.keys)?p2.keys:[]).map(String).filter(k=>cand.some(a=>key(a.lawId,a.n)===k)).slice(0,3);
    done({und,answer:String(p2&&p2.answer||''),keys,hl:(p2&&p2.quotes)||{}});
  }catch(e){
    const c=e&&e.code;done({err:c==='not_granted'?'لم يُسمح باستخدام السؤال. يمكنك السماح به عند السؤال مرة أخرى بعد إعادة فتح الصفحة.':c==='rate_limited'?'كثرت الأسئلة في وقت قصير، انتظر قليلاً ثم اسأل.':'تعذر الحصول على جواب الآن. حاول مرة أخرى.'});
  }
}
function scrollEnd(){requestAnimationFrame(()=>window.scrollTo({top:document.body.scrollHeight}))}

/* ---------- router ---------- */
function route(){
  const h=(location.hash||'#home').slice(1);let m,html,nav='home';
  if(h==='home'||h==='')html=vHome();
  else if(h==='laws'){html=vLaws();nav='laws'}
  else if((m=h.match(/^cat-([a-z]+)$/))){html=vLaws(m[1]);nav='laws'}
  else if((m=h.match(/^law-([A-Za-z0-9]+)$/))){html=vLaw(m[1]);nav='laws'}
  else if((m=h.match(/^art-([A-Za-z0-9]+)-([0-9_]+)$/))){html=vArt(m[1],m[2]);nav='laws'}
  else if(h==='saved'){html=vSaved();nav='saved'}
  else if(h==='ask'){html=vAsk();nav='ask'}
  else if(h==='import'){html=vImport();nav='laws'}
  else if(h==='search'){html=vSearch(S.q||'');nav='home'}
  else html=vMissing();
  document.querySelectorAll('[data-nav]').forEach(a=>a.setAttribute('aria-current',a.dataset.nav===nav?'page':'false'));
  return html;
}
let lastHash='';
function render(){
  const ae=document.activeElement;const fid=ae&&ae.id;const sel=ae&&('selectionStart' in ae)?[ae.selectionStart,ae.selectionEnd]:null;
  if(S.imp&&location.hash==='#import'){['iname','idec','icat','itext'].forEach(i=>{const el=document.getElementById(i);if(el)S.imp[{iname:'name',idec:'decree',icat:'cat',itext:'text'}[i]]=el.value})}
  $app.innerHTML=route();
  if(fid){const el=document.getElementById(fid);if(el){el.focus();if(sel&&el.setSelectionRange)try{el.setSelectionRange(sel[0],sel[1])}catch(e){}}}
  if(location.hash!==lastHash){lastHash=location.hash;if(!/^#ask/.test(location.hash))window.scrollTo(0,0)}
}
window.addEventListener('hashchange',()=>{S.artTab='text';if(location.hash==='#import'&&!S.imp)S.imp={cat:'qadaa'};render()});

/* ---------- events ---------- */
$app.addEventListener('submit',e=>{
  e.preventDefault();
  if(e.target.id==='homeForm'){const q=document.getElementById('hq').value.trim();if(!q)return;S.q=q;
    const m=norm(q).match(/^م?\s*(\d{1,4})$/);const hits=search(q,40);
    if(m&&hits.length===1){location.hash=artRef(hits[0]);return}
    location.hash='#search';render()}
  if(e.target.id==='askForm'){const el=document.getElementById('aq');const q=el.value;el.value='';ask(q)}
});
$app.addEventListener('click',e=>{
  const t=e.target.closest('button');if(!t)return;
  if(t.dataset.q){S.q=t.dataset.q;location.hash='#search';render();return}
  if(t.dataset.chap!=null){const id=location.hash.slice(5);const ui=S.lawUi[id];ui.open[t.dataset.chap]=!ui.open[t.dataset.chap];render();return}
  if(t.dataset.reg!=null){const id=location.hash.slice(5);S.lawUi[id].reg=t.dataset.reg==='1';render();return}
  if(t.dataset.tab){S.artTab=t.dataset.tab;render();return}
  if(t.dataset.cite){const a=fromKey(t.dataset.cite);if(a)copy(citeText(a),'نُسخت المادة بصيغة التسبيب');return}
  const m=location.hash.match(/^#art-([A-Za-z0-9]+)-([0-9_]+)$/);const a=m&&getArt(m[1],m[2]);
  if(t.id==='saveBtn'&&a){if(!db){toast('الحفظ غير متاح الآن');return}toggleSave(a);return}
  if(t.id==='cpText'&&a){copy(a.text,'نُسخ نص المادة');return}
  if(t.id==='cpCite'&&a){copy(citeText(a),'نُسخت بصيغة التسبيب');return}
  if(t.id==='saveNote'&&a){const v=document.getElementById('nt').value.trim();const k=key(a.lawId,a.n);S.notes[k]=v;
    (db?(v?db.doc('notes/'+k).set({text:v,at:Date.now()}):db.doc('notes/'+k).delete()):Promise.reject()).then(()=>toast('حُفظت الملاحظة')).catch(()=>toast('تعذر حفظ الملاحظة'));S.artTab='text';render();return}
  if(t.id==='askThis'){location.hash='#ask';setTimeout(()=>ask(S.q),0);return}
  if(t.id==='clearChat'){S.chat=[];render();return}
  if(t.id==='impPrev'){render();const st=S.imp;st.err='';if(!st.name||!st.name.trim()){st.err='اكتب اسم النظام.';render();return}
    const r=parseLaw(st.text||'');st.preview=r.arts;st.warn=r.warn;if(!r.arts.length)st.err='لم أجد أسطراً تبدأ بـ«المادة». تأكد من أن كل مادة تبدأ بسطر جديد.';render();return}
  if(t.id==='impSave'){saveImport();return}
});
$app.addEventListener('input',e=>{
  if(e.target.id==='lq'){const id=location.hash.slice(5);S.lawUi[id].q=e.target.value;clearTimeout(S._lq);S._lq=setTimeout(render,180)}
});

/* ---------- boot ---------- */
if(location.hash==='#import')S.imp={cat:'qadaa'};
render();
loadAll();
(async()=>{try{if(!window.claude)return;const u=await claude.use('user');if(u){S.isOwner=await u.isOwner();render()}}catch(e){}})();
})();
</script>
