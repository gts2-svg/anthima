<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>الأنظمة</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#123c63">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="الأنظمة">
<meta name="format-detection" content="telephone=no">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;600;700&family=Amiri:wght@400;700&family=Noto+Naskh+Arabic:wght@400;700&family=Aref+Ruqaa:wght@700&display=swap">
<style>
/* Layout: a fixed full-screen shell — navy top bar (covers the clock area), one scrolling content area, tab bar on the bottom edge */
:root{
  --navy:#123c63;--navy-soft:#eaf0f7;--navy-line:#cfdbe8;
  --gold:#b8892b;--gold-ink:#8a6418;--gold-soft:#fbf4e4;--gold-line:#efdcb0;--gold-hi:#fff1cf;
  --bg:#f5f6f8;--card:#ffffff;--card2:#fbfcfd;--line:#e3e8ef;--line2:#eef1f5;--field:#f1f4f8;
  --ink:#1b2430;--mut:#5d6a78;--link:#123c63;--danger:#a3312a;--ok:#1f6b52;--ok-soft:#ecf5f1;
  --ui:'IBM Plex Sans Arabic',-apple-system,system-ui,sans-serif;
  --text:'Amiri','Geeza Pro',serif;--fs:1;
  --st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px);
  --sl:max(16px,env(safe-area-inset-left,0px));--sr:max(16px,env(safe-area-inset-right,0px));
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --navy:#16426b;--navy-soft:#1b2a3a;--navy-line:#2b3f55;--gold:#d4a94f;--gold-ink:#e2bd6a;--gold-soft:#2a2416;--gold-line:#4a3c1e;--gold-hi:#4a3c1a;
  --bg:#0f151d;--card:#161f2a;--card2:#131b25;--line:#253243;--line2:#1d2836;--field:#1b2531;--ink:#e9eef4;--mut:#9fb0c2;--link:#9cc3ea;--danger:#e07a72;--ok:#7cc4a4;--ok-soft:#16302a;color-scheme:dark}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:#123c63;overscroll-behavior:none}
/* iOS 26 home-screen apps (WebKit bug 301108): the view is cut short by the status-bar height while the page
   is shorter than the screen. Giving the page a full-screen minimum height makes iOS give it the whole screen. */
@media (display-mode: standalone){html{min-height:min(100lvh,calc(100% + env(safe-area-inset-top,0px)))}}
body{font-family:var(--ui);font-size:15px;color:var(--ink);direction:rtl;-webkit-text-size-adjust:100%}
body.f-naskh{--text:'Noto Naskh Arabic','Geeza Pro',serif}
body.f-plex{--text:'IBM Plex Sans Arabic',-apple-system,sans-serif}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
input,textarea,select{font-size:16px}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
[hidden]{display:none!important}
#root{position:fixed;top:0;left:0;right:0;bottom:0;display:flex;flex-direction:column;background:var(--bg);overflow:hidden}
/* home title: library name (Amiri) + owner signature (Ruqaa) */
.brandt{display:flex;flex-direction:column;align-items:center;text-align:center;gap:0}
.brandt .lib{font-family:'Amiri',serif;font-size:27px;font-weight:700;line-height:1.4;color:#fff}
.orn{display:flex;align-items:center;gap:8px;margin:5px 0 1px}
.orn i{height:1px;width:42px;background:linear-gradient(90deg,transparent,#d4a94f)}
.orn i:last-child{background:linear-gradient(270deg,transparent,#d4a94f)}
.orn b{width:5px;height:5px;background:#d4a94f;transform:rotate(45deg)}
.brandt .own{font-family:'Aref Ruqaa','Amiri',serif;font-size:27px;font-weight:700;color:#e7c27a;line-height:1.6}
/* splash cover */
#splash{position:fixed;top:0;left:0;right:0;bottom:0;z-index:60;background:radial-gradient(120% 80% at 50% 45%,#1a4f80 0%,#123c63 55%,#0d2d4b 100%);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 30px;transition:opacity .35s ease}
#splash.out{opacity:0;pointer-events:none}
#splash .fr{position:absolute;border:1px solid rgba(212,169,79,.55);border-radius:22px;top:calc(var(--st) + 14px);bottom:calc(var(--sb) + 26px);left:22px;right:22px}
#splash .fr2{position:absolute;border:1px solid rgba(212,169,79,.25);border-radius:16px;top:calc(var(--st) + 22px);bottom:calc(var(--sb) + 34px);left:30px;right:30px}
#splash .in{display:flex;flex-direction:column;align-items:center;transition:opacity .3s ease}
#splash.wait .in{opacity:0}
#splash .dia{width:10px;height:10px;background:#d4a94f;transform:rotate(45deg);margin-bottom:26px}
#splash .lib{font-family:'Amiri',serif;font-size:min(40px,9.6vw);font-weight:700;line-height:1.35;text-align:center}
#splash .orn{margin:18px 0 10px}#splash .orn i{width:60px}#splash .orn b{width:6px;height:6px}
#splash .own{font-family:'Aref Ruqaa','Amiri',serif;font-size:min(40px,9.6vw);font-weight:700;color:#e7c27a;line-height:1.5}
#splash .tap{position:absolute;bottom:calc(var(--sb) + 52px);font-size:12px;color:rgba(201,214,228,.75)}
@media (prefers-reduced-motion:reduce){#splash,#splash .in{transition:none}}

/* top bar */
#top{flex:none;background:var(--navy);color:#fff;padding:calc(var(--st) + 24px) var(--sr) 12px var(--sl);display:flex;flex-direction:column;gap:12px}
#top.home{padding-bottom:18px;border-radius:0 0 24px 24px}
.tr{display:flex;align-items:center;gap:10px;min-width:0}
.tt{flex:1;min-width:0;display:flex;flex-direction:column}
.tt b{font-size:17px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tt small{font-size:12px;color:#c9d6e4;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib{width:42px;height:42px;border-radius:13px;border:0;background:rgba(255,255,255,.13);color:#fff;display:grid;place-items:center;flex:none}
.ib.on{background:var(--gold)}
.hello{font-size:13px;color:#e7cf98;font-weight:600}
.h1{font-size:25px;font-weight:700;margin:0}
.search{background:#fff;border-radius:15px;height:50px;display:flex;align-items:center;gap:10px;padding:0 14px;color:#5d6a78;width:100%}
.search input{border:0;outline:0;flex:1;min-width:0;background:transparent;color:#1b2430}

/* content */
#main{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior-y:contain}
.wrap{padding:16px var(--sr) 28px var(--sl);display:flex;flex-direction:column;gap:14px;max-width:640px;margin:0 auto}
.sh{display:flex;align-items:center;gap:10px}
.sh h2{margin:0;font-size:16px;font-weight:700;flex:1}
.link{background:none;border:0;color:var(--link);font-size:13px;font-weight:600;padding:6px 0}
.muted{color:var(--mut);font-size:13px;line-height:1.7}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px}
.empty{background:var(--card);border:1px dashed var(--navy-line);border-radius:16px;padding:18px;color:var(--mut);line-height:1.9}
.empty b{color:var(--ink)}
.note{background:var(--gold-soft);border:1px solid var(--gold-line);border-radius:12px;padding:10px 14px;line-height:1.8;font-size:14px}
.note b{color:var(--gold-ink)}
.num{min-width:42px;height:42px;padding:0 6px;border-radius:11px;background:var(--navy);color:#fff;font-weight:700;display:grid;place-items:center;font-size:14px;flex:none;font-variant-numeric:tabular-nums}
.num.s{min-width:36px;height:30px;border-radius:9px;font-size:13px}
.num.soft{background:var(--navy-soft);color:var(--link)}
.num.gold{background:var(--gold-soft);color:var(--gold-ink)}
.row{display:flex;align-items:center;gap:12px;width:100%;text-align:right;background:none;border:0;border-top:1px solid var(--line2);padding:12px 14px;color:var(--ink);min-height:58px}
.row:first-child{border-top:0}
.row .t{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.row .t b{font-size:14px;font-weight:600}
.row .t small{font-size:12px;color:var(--mut)}
.row .ex{font-family:var(--text);font-size:15.5px;color:var(--mut);line-height:1.7;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.chips{display:flex;gap:7px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--card);border-radius:20px;padding:6px 13px;font-size:13px;white-space:nowrap;color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:#fff;font-weight:600}
.btn{min-height:44px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--link);font-weight:600;font-size:14px;padding:0 14px;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn.gold{border:0;background:var(--gold);color:#fff;font-weight:700}
.btn.navy{border:0;background:var(--navy);color:#fff;font-weight:700}
.btn.sm{min-height:38px;font-size:13px;padding:0 12px;border-radius:10px}
.btn.danger{color:var(--danger)}
.btn:disabled{opacity:.5}
.btns{display:flex;gap:8px;flex-wrap:wrap}

/* home */
.recent{display:flex;flex-direction:column}
.lawc{display:flex;align-items:stretch;gap:0;width:100%;text-align:right;background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;padding:0;color:var(--ink)}
.lawc .bar{width:6px;flex:none}
.lawc .in{flex:1;min-width:0;padding:13px 14px;display:flex;flex-direction:column;gap:3px}
.lawc .cat{font-size:12px;color:var(--gold-ink);font-weight:700}
.lawc .nm{font-family:var(--text);font-size:21px;line-height:1.45;font-weight:700}
.lawc small{font-size:12px;color:var(--mut)}
.laws{display:flex;flex-direction:column;gap:10px}
.hscroll{display:flex;gap:7px;overflow-x:auto;scrollbar-width:none;margin:0 calc(-1 * var(--sr)) 0 calc(-1 * var(--sl));padding:0 var(--sr) 2px var(--sl)}
.hscroll::-webkit-scrollbar{display:none}

/* book */
.cover{background:var(--navy);color:#fff;border-radius:18px;padding:20px 18px;display:flex;flex-direction:column;gap:10px}
.cover .cat{font-size:12px;color:#e7cf98;font-weight:700}
.cover h1{font-family:var(--text);font-size:30px;line-height:1.35;margin:0}
.cover .dec{font-size:13px;color:#c9d6e4;line-height:1.7}
.stats{display:flex;gap:22px}
.stats b{font-size:22px;display:block}.stats span{font-size:12px;color:#c9d6e4}
.toc{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:6px 6px}
.parth{font-size:13px;font-weight:700;color:var(--link);background:var(--navy-soft);border-radius:10px;padding:9px 12px;margin:8px 4px 2px}
.ch{display:flex;flex-direction:column;gap:2px;width:100%;text-align:right;background:none;border:0;border-bottom:1px solid var(--line2);padding:11px 12px;color:var(--ink)}
.ch:last-child{border-bottom:0}
.ch .p{font-size:12.5px;color:var(--gold-ink);font-weight:700}
.ch .n{font-family:var(--text);font-size:19px;line-height:1.5}
.ch .c{font-size:12px;color:var(--mut)}
.ch.sub{padding-inline-start:22px}
.ch.here{background:var(--navy-soft);border-radius:10px}
.fieldin{background:var(--field);border-radius:12px;height:46px;display:flex;align-items:center;gap:8px;padding:0 12px;color:var(--mut)}
.fieldin input{border:0;outline:0;flex:1;min-width:0;background:transparent;color:var(--ink)}

/* reading */
.rbar{position:sticky;top:0;z-index:3;background:var(--bg);border-bottom:1px solid var(--line);padding:10px 0 8px;display:flex;flex-direction:column;gap:8px}
.rbar .hscroll{margin:0;padding:0 var(--sr) 0 var(--sl)}
.nums{display:flex;gap:6px}
.nums button{min-width:46px;height:34px;border-radius:9px;border:0;background:var(--field);color:var(--ink);font-size:13px;font-variant-numeric:tabular-nums;flex:none;padding:0 6px}
.nums button.on{background:var(--navy);color:#fff;font-weight:700}
.nums button.nt{background:var(--gold-soft);color:var(--gold-ink);font-weight:700}
.chtitle{font-family:var(--text);font-size:22px;color:var(--link);margin:2px 0 0;line-height:1.5}
.art{display:flex;flex-direction:column;gap:8px;padding:14px 14px;border-radius:16px;border:1.5px solid transparent;background:var(--card);width:100%;text-align:right;color:var(--ink)}
.art.on{border-color:var(--navy)}
.ah{display:flex;align-items:center;gap:10px}
.ah .t{flex:1;min-width:0;display:flex;flex-direction:column}
.ah .t b{font-size:13px;color:var(--gold-ink)}
.ah .t small{font-size:12px;color:var(--mut)}
.art p{margin:0;font-family:var(--text);font-size:calc(19px * var(--fs));line-height:1.95;text-align:justify;white-space:pre-line;-webkit-user-select:text;user-select:text}
.flags{display:flex;gap:6px;flex-wrap:wrap}
.flag{font-size:11.5px;border-radius:6px;padding:1px 8px;background:var(--navy-soft);color:var(--link);font-weight:600}
.flag.r{background:#fbeaea;color:#a3312a}
.reg{font-family:var(--text);font-size:calc(16px * var(--fs));line-height:1.9;background:var(--gold-soft);border:1px solid var(--gold-line);border-radius:12px;padding:10px 12px;white-space:pre-line;-webkit-user-select:text;user-select:text}
.reg b{font-family:var(--ui);font-size:12px;color:var(--gold-ink);display:block}
.mynote{font-size:14px;line-height:1.8;background:var(--gold-soft);border-radius:10px;padding:8px 12px}
.mynote b{color:var(--gold-ink)}
textarea.nt{width:100%;min-height:100px;border:1px solid var(--line);border-radius:12px;background:var(--card);padding:10px;line-height:1.8;resize:vertical}
.part{font-size:12px;color:var(--mut)}
.pager{display:flex;justify-content:space-between;gap:8px}

/* ask */
.askbox{display:flex;gap:8px;align-items:flex-end}
.askbox textarea{flex:1;min-width:0;border:1px solid var(--line);border-radius:14px;background:var(--card);padding:10px 12px;min-height:48px;max-height:140px;line-height:1.7;resize:none}
.send{width:48px;height:48px;border-radius:14px;border:0;background:var(--navy);color:#fff;display:grid;place-items:center;flex:none}
.send:disabled{opacity:.5}
.qa{display:flex;flex-direction:column;gap:8px}
.bub{align-self:flex-start;max-width:90%;background:var(--navy);color:#fff;border-radius:16px 16px 4px 16px;padding:9px 13px;line-height:1.7;white-space:pre-wrap}
.ans{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:9px;line-height:1.85}
.ans .und{font-size:12.5px;color:var(--mut)}.ans .und b{color:var(--link)}
.err{color:var(--danger)}
.srcb{display:flex;gap:10px;align-items:flex-start;text-align:right;background:var(--card2);border:1px solid var(--navy-line);border-radius:12px;padding:10px;width:100%;color:var(--ink)}
.srcb .t{flex:1;min-width:0;display:flex;flex-direction:column}
.srcb small{color:var(--mut);font-size:12px}
.srcb span.tx{font-family:var(--text);font-size:calc(16px * var(--fs));line-height:1.85}
mark{background:var(--gold-hi);color:inherit;border-radius:4px;padding:0 2px}
.dots{display:inline-flex;gap:4px;vertical-align:middle}.dots i{width:6px;height:6px;border-radius:50%;background:var(--mut);animation:b 1s infinite}.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes b{0%,100%{opacity:.25}50%{opacity:1}}

/* settings */
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:13px;font-weight:600}
.field input{border:1px solid var(--line);background:var(--card);border-radius:12px;height:46px;padding:0 12px;direction:ltr;text-align:left}
.seg{display:flex;background:var(--field);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:transparent;border-radius:9px;min-height:38px;font-size:13px;color:var(--mut);padding:0 6px}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--link);font-weight:700;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.sec{padding:16px;display:flex;flex-direction:column;gap:12px}
.sec>b{font-size:15px}

/* tab bar */
html.short{--sb:0px}
html.short #tabs{padding-top:4px;padding-bottom:0}
html.short #tabs button{min-height:46px;justify-content:flex-end;padding-bottom:3px}
#tabs{flex:none;background:#123c63;border-top:0;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));padding:6px var(--sr) calc(var(--sb) + 6px) var(--sl)}
#tabs button{border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:rgba(255,255,255,.72);font-size:11px;min-height:48px;position:relative}
#tabs button[aria-current="page"]{color:#e7c27a;font-weight:700}
#tabs .cnt{position:absolute;top:2px;inset-inline-start:calc(50% + 6px);background:var(--gold);color:#fff;border-radius:10px;font-size:10px;padding:0 5px;line-height:16px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--sb) + 76px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;z-index:20;max-width:88%;text-align:center}
@media (prefers-reduced-motion:reduce){.dots i{animation:none}}

/* مقارنة نظامين */
.fl{font-size:12.5px;color:var(--mut);font-weight:600;margin:4px 4px -6px}
.cpick label{display:flex;flex-direction:column;gap:6px;padding:12px 14px;font-size:12.5px;color:var(--mut);border-top:1px solid var(--line2)}
.cpick label:first-child{border-top:0}.cpick label small{display:none}
.csel{width:100%;border:1px solid var(--line);border-radius:10px;background:var(--field);color:var(--ink);padding:10px;font-size:15px;-webkit-appearance:none;appearance:none}
.cvs{text-align:center;color:var(--gold-ink);font-weight:700;font-size:13px;margin:-4px 0}
.btn.big{min-height:48px;font-size:15px;width:100%}
.hint{font-size:12.5px;color:var(--mut);line-height:1.8;margin:0 4px}
.cstats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.cst{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 2px;text-align:center;color:var(--ink)}
.cst b{display:block;font-size:19px}.cst span{font-size:11px;color:var(--mut)}
.cintro{padding:16px;display:flex;flex-direction:column;gap:10px}.cintro b{font-size:15px;color:var(--navy)}.cintro p{margin:0;line-height:1.9;font-size:14px}.cintro small{color:var(--mut);font-size:12px;line-height:1.7}
.csec{padding:14px;border-top:1px solid var(--line2)}.csec:first-child{border-top:0}
.csec h3{margin:0 0 8px;font-size:15px;color:var(--link);display:flex;align-items:center;gap:6px}
.cpt{font-family:var(--text);font-size:calc(17px * var(--fs));line-height:1.9;padding:6px 0 6px;border-top:1px dashed var(--line2)}
.cpt:first-of-type{border-top:0}
.crefs{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.cref{font-family:var(--ui);font-size:11.5px;border:0;border-radius:6px;padding:1px 7px;margin:0 2px;white-space:nowrap;vertical-align:1px;cursor:pointer}
.cref.o{background:var(--gold-soft);color:var(--gold-ink)}.cref.n{background:var(--navy-soft);color:var(--link)}
.ctag{font-family:var(--ui);font-size:11px;border-radius:6px;padding:2px 7px;font-weight:600;white-space:nowrap}
.ctag.mod{background:var(--gold-soft);color:var(--gold-ink)}.ctag.del{background:#fbeceb;color:var(--danger)}.ctag.new{background:var(--ok-soft);color:var(--ok)}.ctag.same{background:var(--field);color:var(--mut)}.ctag.fav{background:var(--navy);color:#fff}.ctag.mv{background:var(--field);color:var(--link)}
.cbal{display:flex;height:10px;border-radius:6px;overflow:hidden;margin:2px 0 4px}.cbal i{display:block}
.cbl{display:flex;justify-content:space-between;font-size:11.5px;color:var(--mut);margin-bottom:6px;gap:6px}
.cprog,.cfoot{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12.5px;color:var(--mut);padding:0 4px}
.crow{padding:12px 14px;border-top:1px solid var(--line2);display:flex;flex-direction:column;gap:6px}.crow:first-child{border-top:0}
.crh{display:flex;align-items:center;gap:6px;flex-wrap:wrap}.crr{flex:1;display:flex;flex-wrap:wrap;gap:3px;align-items:center}.carr{color:var(--mut);font-size:12px}
.cnote{font-size:13px;color:var(--mut);line-height:1.7}
.ctx{all:unset;display:-webkit-box;-webkit-line-clamp:6;-webkit-box-orient:vertical;overflow:hidden;font-family:var(--text);font-size:calc(17px * var(--fs));line-height:1.9;white-space:pre-line;color:var(--ink);cursor:pointer;text-align:justify}
.ctx.open{display:block}
.ctx del,.cans del{background:#f6d6d3;color:#7d211b;text-decoration:line-through;text-decoration-color:var(--danger)}
.ctx ins{background:#d3ecdf;color:#164d3b;text-decoration:none}
.cans{white-space:pre-line}
@media (prefers-color-scheme:dark){.ctx del{background:#4a2321;color:#f2b8b2}.ctx ins{background:#173b2e;color:#a9e0c6}.ctag.del{background:#3a1f1e}}
</style>
</head>
<body>
<div id="splash" class="wait" role="img" aria-label="مكتبة الأنظمة الخاصة — جبران طالع التليدي"><span class="fr"></span><span class="fr2"></span><div class="in"><span class="dia"></span><div class="lib">مكتبة الأنظمة الخاصة</div><div class="orn"><i></i><b></b><i></i></div><div class="own">جبران طالع التليدي</div></div><span class="tap">المس للدخول</span></div>
<div id="root">
  <header id="top"></header>
  <main id="main"></main>
  <nav id="tabs" aria-label="التنقل">
    <button data-tab="home"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>الرئيسية</button>
    <button data-tab="saved"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M6 3h12v18l-6-4-6 4z"/></svg>المحفوظات</button>
    <button data-tab="cmp"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><rect x="3" y="4" width="7" height="16" rx="2"/><rect x="14" y="4" width="7" height="16" rx="2"/></svg>المقارنة<span class="cnt" id="cmpCnt" hidden></span></button>
    <button data-tab="ask"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/></svg>اسأل</button>
    <button data-tab="set"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1 7 17M17 7l2.1-2.1"/></svg>الإعدادات</button>
  </nav>
</div>
<div class="toast" id="toast" role="status" hidden></div>
<script src="cmp-core.js"></script>
<script>
(function(){
'use strict';
const $=(id)=>document.getElementById(id);
const top=$('top'),main=$('main');
const esc=(s)=>String(s==null?'':s).replace(/[&<>"']/g,(c)=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const CATS=[['qadaa','القضاء والإجراءات'],['madani','المدني'],['tijari','التجاري'],['muroor','المرور والتأمين'],['jazai','الجزائي'],['ahwal','الأحوال الشخصية'],['amal','العمل'],['other','أنظمة أخرى']];
const catName=(id)=>(CATS.find((c)=>c[0]===id)||CATS[CATS.length-1])[1];
const BAND={qadaa:'#123c63',madani:'#3f6f99',tijari:'#2f7a62',muroor:'#b8892b',jazai:'#5b6b7d',ahwal:'#6b5a8e',amal:'#2f7a62',other:'#7b8794'};
const IC={
 back:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>',
 search:'<svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>',
 star:'<svg width="19" height="19" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M6 3h12v18l-6-4-6 4z"/></svg>',
 starO:'<svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M6 3h12v18l-6-4-6 4z"/></svg>',
 pen:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16z"/></svg>',
 copy:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V5a1 1 0 0 0-1-1H5a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h3"/></svg>',
 send:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 12H4M10 6l-6 6 6 6"/></svg>'
};

/* ---------- storage ---------- */
function ls(k,v){try{if(v===undefined)return JSON.parse(localStorage.getItem(k)||'null');localStorage.setItem(k,JSON.stringify(v));}catch(e){return null;}}
const U=Object.assign({saved:{},notes:{},recent:[],compare:[],font:'amiri',fs:1,model:'quick',key:''},ls('anz_user')||{});
(function migrate(){const o=ls('anz_local');if(!o||U._mig)return;try{const sv=o.saved||{},nt=o.notes||{};Object.keys(sv).forEach((k)=>{U.saved[k]=sv[k]&&sv[k].data?sv[k].data:(sv[k]||{at:Date.now()});});Object.keys(nt).forEach((k)=>{const v=nt[k];const t=v&&(v.text||(v.data&&v.data.text));if(t)U.notes[k]=t;});}catch(e){}U._mig=1;saveU();})();
function saveU(){ls('anz_user',U);}

/* ---------- state ---------- */
const S={laws:{},arts:{},order:[],loaded:false,err:'',view:'home',lawId:null,chap:0,sel:null,q:'',qLaw:'all',tocQ:'',cat:'all',regOpen:{},noteEdit:null,chat:[],busy:false,depth:0};
const key=(l,n)=>l+'-'+n;
const lawOf=(k)=>k.slice(0,k.indexOf('-'));
const label=(a)=>a.label||String(a.n);
function fromKey(k){const i=k.indexOf('-');const l=k.slice(0,i),n=k.slice(i+1);return (S.arts[l]||[]).find((a)=>a.n===n);}
function chaptersOf(id){const out=[];let cur=null;(S.arts[id]||[]).forEach((a,i)=>{const p=a.part||'',t=a.chapter||'';if(!cur||cur.rp!==p||cur.rt!==t){cur={rp:p,rt:t,t:t||p,part:t?p:'',sub:!!(t&&p),from:i,arts:[]};out.push(cur);}cur.arts.push(a);});return out;}
function splitChap(t){const m=String(t||'').match(/^((?:الباب|الفصل|القسم|الكتاب|الفرع)\s+\S+(?:\s+(?:عشر|عشرة))?)\s*[:：\-–]\s*(.+)$/);return m?[m[1],m[2]]:['',t||'المواد'];}

/* ---------- search ---------- */
function norm(s){return String(s||'').replace(/[ً-ْٰـ]/g,'').replace(/[أإآٱ]/g,'ا').replace(/ة/g,'ه').replace(/ى/g,'ي').replace(/ؤ/g,'و').replace(/ئ/g,'ي').replace(/[٠-٩]/g,(d)=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/[^ء-ي0-9a-z\s/]/gi,' ').replace(/\s+/g,' ').trim().toLowerCase();}
function lev(a,b){if(Math.abs(a.length-b.length)>1)return 2;let p=Array.from({length:b.length+1},(_,i)=>i);for(let i=1;i<=a.length;i++){const c=[i];for(let j=1;j<=b.length;j++)c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1));p=c;}return p[b.length];}
const STOP=new Set('في من على عن الى الي او ان اذا ما لا هل وش ايش كيف متى اللي الذي التي هو هي و ثم مع بعد قبل كل له لها به بها هذا هذه ذلك تلك يا اي عند كان يكون تكون اريد ابغي ابي نص الماده ماده نظام يقول تقول'.split(' '));
function toks(s){return norm(s).split(' ').filter((w)=>w.length>1&&!STOP.has(w)).map((w)=>(w.length>4?w.replace(/^(وال|بال|فال|كال|لل|ال|و)/,''):w));}
function search(q,limit,only){
  q=String(q||'').trim();if(!q)return[];
  const nm=norm(q).match(/(?:^|\s|م)(\d{1,4})(?:\/\d+)?(?:\s|$)/);const qt=toks(q);const res=[];
  for(const id of S.order){if(only&&id!==only)continue;const L=S.laws[id];if(!L._t)L._t=toks(L.name);
    const lawHit=qt.some((t)=>L._t.some((w)=>w===t||(t.length>=4&&w.startsWith(t))));
    for(const a of S.arts[id]){let sc=0;
      if(nm&&a.n===nm[1])sc+=lawHit?9:6;
      if(!a._s){a._s=new Set(toks(a.text+' '+(a.title||'')+' '+(a.reg||'')));}
      for(const t of qt){if(/^\d+$/.test(t))continue;if(a._s.has(t)){sc+=2;continue;}if(L._t.includes(t)){sc+=0.4;continue;}
        if(t.length>=4){for(const w of a._s){if(w.length>=4&&(w.startsWith(t)||t.startsWith(w)||lev(w,t)<=1)){sc+=1.2;break;}}}}
      if(sc>0)res.push({a,sc});}}
  res.sort((x,y)=>y.sc-x.sc);return res.slice(0,limit||60).map((r)=>r.a);
}
function directHit(q){
  const m=norm(q).match(/\d{1,4}/);if(!m||norm(q).split(' ').length>4)return null;
  const qt=toks(q).filter((t)=>!/^\d+$/.test(t)&&t!=='م');let hits=[];
  for(const id of S.order){const a=S.arts[id].find((x)=>x.n===m[0]);if(a)hits.push(a);}
  if(qt.length)hits=hits.filter((a)=>{const lt=toks(S.laws[a.lawId].name);return qt.every((t)=>lt.some((w)=>w===t||w.startsWith(t)||t.startsWith(w)||(t.length>=4&&lev(w,t)<=1)));});
  return hits.length===1?hits[0]:null;
}

/* ---------- helpers ---------- */
let tT;function toast(m){const t=$('toast');t.textContent=m;t.hidden=false;clearTimeout(tT);tT=setTimeout(()=>{t.hidden=true;},2200);}
async function copy(txt,msg){try{await navigator.clipboard.writeText(txt);toast(msg||'نُسخ');}catch(e){const ta=document.createElement('textarea');ta.value=txt;ta.setAttribute('readonly','');ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();ta.setSelectionRange(0,txt.length);let ok=false;try{ok=document.execCommand('copy');}catch(_){}ta.remove();toast(ok?(msg||'نُسخ'):'تعذر النسخ');}}
function citeOne(a,same){const L=S.laws[a.lawId];return 'المادة ('+label(a)+') من '+(same?'ذات النظام':(L?L.name:'النظام'))+' ونصها: "'+String(a.text).trim().replace(/\s*\n\s*/g,' ')+'"';}
const citeText=(a)=>'وبناءً على '+citeOne(a);
function citeMany(ks){let prev=null;return 'وبناءً على '+ks.map((k,i)=>{const a=fromKey(k);const s=(i?'و':'')+citeOne(a,prev===a.lawId);prev=a.lawId;return s;}).join('، ');}
function pushRecent(a){const k=key(a.lawId,a.n);U.recent=[k].concat(U.recent.filter((x)=>x!==k)).slice(0,30);saveU();}
function applyFont(){document.body.classList.toggle('f-naskh',U.font==='naskh');document.body.classList.toggle('f-plex',U.font==='plex');document.documentElement.style.setProperty('--fs',String(U.fs||1));}

/* ---------- routing ---------- */
function nav(h){if(location.hash==='#'+h){route();return;}S.depth++;location.hash=h;}
function goBack(){if(S.depth>0){S.depth--;history.back();}else{location.hash='home';}}
window.addEventListener('hashchange',route);
function route(){
  const h=(location.hash||'#home').slice(1);let m;S.noteEdit=null;
  if((m=h.match(/^read-([a-z0-9]+)-(\d+)(?:-([0-9_]+))?$/))&&S.laws[m[1]]){S.view='read';S.lawId=m[1];S.chap=+m[2];const c=chaptersOf(m[1])[S.chap];S.sel=m[3]||(c?c.arts[0].n:null);}
  else if((m=h.match(/^book-([a-z0-9]+)$/))&&S.laws[m[1]]){S.view='book';S.lawId=m[1];S.tocQ='';}
  else if(['home','saved','cmp','cmpr','ask','set','search'].includes(h))S.view=h;
  else S.view='home';
  render(true);
}
function openArticle(lawId,n){const arts=S.arts[lawId]||[];const i=arts.findIndex((a)=>a.n===String(n));if(i<0)return;const ci=chaptersOf(lawId).findIndex((c)=>i>=c.from&&i<c.from+c.arts.length);pushRecent(arts[i]);nav('read-'+lawId+'-'+Math.max(0,ci)+'-'+arts[i].n);}

/* ---------- views ---------- */
function topBar(title,sub,right){return '<div class="tr"><button class="ib" data-act="back" aria-label="رجوع">'+IC.back+'</button><div class="tt"><b>'+esc(title)+'</b>'+(sub?'<small>'+esc(sub)+'</small>':'')+'</div>'+(right||'')+'</div>';}
function vHome(){
  const h=new Date().getHours();
  top.className='home';
  top.innerHTML='<div class="brandt"><h1 class="lib" style="margin:0">مكتبة الأنظمة الخاصة</h1><div class="orn" aria-hidden="true"><i></i><b></b><i></i></div><div class="own">جبران طالع التليدي</div></div><form class="search" id="hs" role="search">'+IC.search+'<input id="hq" type="search" enterkeyhint="search" placeholder="رقم مادة، كلمة، أو «مرافعات 55»" autocomplete="off" aria-label="بحث"></form>';
  if(!S.loaded)return '<div class="wrap"><div class="empty">'+(S.err?'<b>تعذر تحميل الأنظمة.</b><br>'+esc(S.err):'يتم التحميل…')+'</div></div>';
  const rec=U.recent.map(fromKey).filter(Boolean).slice(0,3);
  const counts={};S.order.forEach((id)=>{const c=S.laws[id].cat||'other';counts[c]=(counts[c]||0)+1;});
  const ids=S.order.filter((id)=>S.cat==='all'||(S.laws[id].cat||'other')===S.cat);
  return '<div class="wrap">'+
   (rec.length?'<div class="sh"><h2>أكمل من حيث توقفت</h2></div><div class="card recent">'+rec.map((a)=>'<button class="row" data-open="'+esc(key(a.lawId,a.n))+'"><span class="num'+(S.laws[a.lawId].cat==='muroor'?' gold':'')+'">'+esc(label(a))+'</span><span class="t"><b>'+esc(a.title||a.heading||('المادة '+label(a)))+'</b><small>'+esc(S.laws[a.lawId].name)+'</small></span></button>').join('')+'</div>':'')+
   '<div class="sh"><h2>المكتبة</h2></div><div class="hscroll"><button class="chip" data-cat="all" aria-pressed="'+(S.cat==='all')+'">الكل · '+S.order.length+'</button>'+CATS.filter((c)=>counts[c[0]]).map((c)=>'<button class="chip" data-cat="'+c[0]+'" aria-pressed="'+(S.cat===c[0])+'">'+c[1]+' · '+counts[c[0]]+'</button>').join('')+'</div>'+
   '<div class="laws">'+ids.map((id)=>{const L=S.laws[id];const n=S.arts[id].length;const hasReg=S.arts[id].some((a)=>a.reg);const sv=Object.keys(U.saved).filter((k)=>lawOf(k)===id).length;
     return '<button class="lawc" data-book="'+id+'"><span class="bar" style="background:'+(BAND[L.cat]||BAND.other)+'"></span><span class="in"><span class="cat">'+esc(catName(L.cat||'other'))+'</span><span class="nm">'+esc(L.name)+'</span><small>'+n+' مادة'+(hasReg?' · مع اللائحة':'')+(L.partial?' · مواد مختارة':'')+(sv?' · '+sv+' محفوظة':'')+'</small></span></button>';}).join('')+'</div>'+
   (S.order.some((id)=>S.laws[id].partial)?'<p class="muted">«مواد مختارة»: فيها مواد من أحكامك فقط، ويُستكمل نصها الكامل عند إضافة ملف النظام.</p>':'')+'</div>';
}
function vBook(){
  const L=S.laws[S.lawId];const arts=S.arts[L.id];const chs=chaptersOf(L.id);
  top.className='';top.innerHTML=topBar(L.name,catName(L.cat||'other'));
  const last=U.recent.find((k)=>lawOf(k)===L.id);const la=last&&fromKey(last);
  const sv=Object.keys(U.saved).filter((k)=>lawOf(k)===L.id).length;
  let toc;
  if(S.tocQ.trim()){const r=search(S.tocQ,80,L.id);toc=r.length?r.map((a)=>'<button class="row" data-open="'+esc(key(L.id,a.n))+'"><span class="num s">'+esc(label(a))+'</span><span class="t"><span class="ex">'+esc(a.text)+'</span></span></button>').join(''):'<p class="muted" style="padding:10px">لا توجد نتائج في هذا النظام.</p>';}
  else{const here=la?chs.findIndex((c)=>c.arts.includes(la)):-1;let lp=null;
    toc=chs.map((c,i)=>{const sp=splitChap(c.t);const f=c.arts[0],l=c.arts[c.arts.length-1];let ph='';if(c.sub&&c.part!==lp)ph='<div class="parth">'+esc(c.part)+'</div>';lp=c.sub?c.part:null;
      return ph+'<button class="ch'+(c.sub?' sub':'')+(i===here?' here':'')+'" data-chap="'+i+'">'+(sp[0]?'<span class="p">'+esc(sp[0])+'</span>':'')+'<span class="n">'+esc(sp[1])+'</span><span class="c">'+(c.arts.length>1?'المواد من '+esc(label(f))+' إلى '+esc(label(l)):'المادة '+esc(label(f)))+'</span></button>';}).join('');}
  return '<div class="wrap"><section class="cover"><span class="cat">'+esc(catName(L.cat||'other'))+'</span><h1>'+esc(L.name)+'</h1>'+(L.decree?'<span class="dec">'+esc(L.decree)+'</span>':'')+
   '<div class="stats"><div><b>'+arts.length+'</b><span>مادة</span></div><div><b>'+sv+'</b><span>محفوظة</span></div></div>'+(L.partial?'<span class="dec">مواد مختارة من أحكامك، والنص الكامل يُضاف من ملف النظام.</span>':'')+
   (arts.length?'<button class="btn gold" data-open="'+esc(la?last:key(L.id,arts[0].n))+'">'+(la?'أكمل من المادة '+esc(label(la)):'ابدأ القراءة')+'</button>':'')+'</section>'+
   '<label class="fieldin">'+IC.search+'<input id="tocq" type="search" placeholder="ابحث في هذا النظام" value="'+esc(S.tocQ)+'" autocomplete="off"></label>'+
   '<div class="toc">'+toc+'</div></div>';
}
function artCard(a){
  const k=key(a.lawId,a.n),on=S.sel===a.n,sv=!!U.saved[k],note=U.notes[k];
  const flags=(a.repealed||a.amended||a.added||a.reg)?'<span class="flags">'+(a.repealed?'<span class="flag r">ملغاة</span>':'')+(a.amended?'<span class="flag">معدّلة</span>':'')+(a.added?'<span class="flag">مضافة</span>':'')+(a.reg?'<span class="flag">لها لائحة</span>':'')+'</span>':'';
  const head='<div class="ah"><span class="num'+(on?'':' soft')+'">'+esc(label(a))+'</span><span class="t">'+(a.title?'<b>'+esc(a.title)+'</b>':'')+'<small>'+esc(a.heading||'')+'</small></span>'+(sv?'<span style="color:var(--gold)">'+IC.star+'</span>':'')+'</div>';
  const body=head+flags+'<p>'+esc(a.text)+'</p>'+(a.partialText?'<span class="part">المعروض جزء من المادة فقط.</span>':'')+(a.note?'<span class="part">'+esc(a.note)+'</span>':'');
  if(!on)return '<div class="art" data-sel="'+esc(a.n)+'" role="button" tabindex="0" aria-label="المادة '+esc(label(a))+'">'+body+(note?'<div class="mynote"><b>ملاحظتي:</b> '+esc(note)+'</div>':'')+'</div>';
  const inC=U.compare.includes(k);
  return '<div class="art on" id="sel">'+body+(a.reg&&S.regOpen[k]?'<div class="reg"><b>اللائحة التنفيذية</b>'+esc(a.reg)+'</div>':'')+

  if(act==='cite'&&a)return copy(citeText(a),'نُسخت بصيغة التسبيب');
  if(act==='copy'&&a)return copy(a.text,'نُسخ نص المادة');
  if(act==='save'&&a){if(U.saved[k])delete U.saved[k];else{U.saved[k]={at:Date.now()};toast('حُفظت في المحفوظات');}saveU();render();return;}
  if(act==='note'){S.noteEdit=k;render();const x=$('ntx');if(x)x.focus();return;}
  if(act==='noteCancel'){S.noteEdit=null;render();return;}
  if(act==='noteSave'){const v=$('ntx').value.trim();if(v)U.notes[k]=v;else delete U.notes[k];saveU();S.noteEdit=null;toast('حُفظت الملاحظة');render();return;}
  if(act==='reg'){S.regOpen[k]=!S.regOpen[k];render();return;}
  if(act==='cmp'&&k){if(U.compare.includes(k))U.compare=U.compare.filter((x)=>x!==k);else{U.compare.push(k);toast('أُضيفت للمقارنة ('+U.compare.length+')');}saveU();render();return;}
  if(act==='cmpClear'){U.compare=[];saveU();render();return;}
  if(act==='cmpCite')return copy(citeMany(U.compare.filter(fromKey)),'نُسخت بصيغة التسبيب');
  if(act==='askThis')return ask(S.q);
  if(act==='clearChat'){S.chat=[];render();return;}
  if(act==='keySave'){const v=$('ak').value.trim();if(!v)return toast('الصق المفتاح أولاً');if(!/^sk-ant-/.test(v))return toast('هذا لا يبدو مفتاح API');U.key=v;saveU();toast('حُفظ المفتاح');render();return;}
  if(act==='keyDel'){U.key='';saveU();toast('حُذف المفتاح');render();return;}
});
document.addEventListener('keydown',(e)=>{const t=e.target.closest&&e.target.closest('[data-sel]');if(t&&(e.key==='Enter'||e.key===' ')){e.preventDefault();t.click();}});
document.addEventListener('submit',(e)=>{
  e.preventDefault();
  if(e.target.id==='hs'){const q=$('hq').value.trim();if(!q)return;$('hq').blur();const h=directHit(q);if(h){openArticle(h.lawId,h.n);return;}S.q=q;S.qLaw='all';nav('search');}
  if(e.target.id==='af'){const el=$('aq');const v=el.value;el.value='';el.blur();ask(v);}
});

});

/* iOS home-screen apps can report a viewport shorter than the screen (by the status-bar height), leaving a strip under the tab bar.
   When that happens, size the shell to the full screen instead. */
function fitShell(){
  const st=navigator.standalone===true||matchMedia('(display-mode: standalone)').matches;
  const ih=innerHeight,sh=screen.height,gap=sh-ih;
  /* iOS home-screen apps sometimes report a viewport shorter than the screen by the status-bar height.
     The page itself still covers the whole screen, so the shell is sized to the full screen height
     (html/body no longer clip with overflow:hidden, which used to cut the tab bar off). */
  const stretch=false;const h=ih;
  document.documentElement.classList.remove('short');
  ['root','splash'].forEach((id)=>{const el=$(id);if(el){el.style.bottom='auto';el.style.height=h+'px';}});
  S.diag='الشاشة '+sh+' · العرض '+ih+' · الفرق '+gap+(stretch?' · ممتد':'')+' · '+(st?'تطبيق':'متصفح');
}
fitShell();addEventListener('resize',fitShell);addEventListener('pageshow',fitShell);document.addEventListener('visibilitychange',()=>setTimeout(fitShell,150));setTimeout(fitShell,500);addEventListener('orientationchange',()=>setTimeout(fitShell,300));
(function splash(){
  const sp=$('splash');if(!sp)return;let gone=false;
  const hide=()=>{if(gone)return;gone=true;sp.classList.add('out');setTimeout(()=>sp.remove(),400);};
  sp.addEventListener('click',hide);
  const show=()=>{sp.classList.remove('wait');setTimeout(hide,1100);};
  const fonts=document.fonts&&document.fonts.load?Promise.all([document.fonts.load('700 40px "Aref Ruqaa"'),document.fonts.load('700 40px "Amiri"')]):Promise.resolve();
  Promise.race([fonts,new Promise((r)=>setTimeout(r,600))]).then(show,show);
  setTimeout(hide,3000);
})();

  S.order=Object.keys(S.laws).sort((a,b)=>(S.laws[a].order||99)-(S.laws[b].order||99));

}).catch((e)=>{S.err=e.message;render(true);});
